# Local full stack: Kafka (KRaft, no ZooKeeper) + scoring API/consumer + dashboard + MLflow UI.
#   make train && docker compose up --build
#   docker compose run --rm producer            # start replaying transactions
services:
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10

  api:
    build: {context: ., dockerfile: docker/Dockerfile}
    image: fraud-platform:latest
    ports: ["8000:8000"]
    environment:
      KAFKA_ENABLED: "1"
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on: {kafka: {condition: service_healthy}}

  dashboard:
    image: fraud-platform:latest
    command: ["streamlit", "run", "src/fraudplat/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]
    environment: {API_URL: "http://api:8000"}
    depends_on: [api]

  producer:
    image: fraud-platform:latest
    command: ["python", "-m", "fraudplat.streaming.producer", "--sink", "kafka", "--rate", "200"]
    environment: {KAFKA_BOOTSTRAP: "kafka:9092"}
    depends_on: {kafka: {condition: service_healthy}}
    profiles: [replay]

  mlflow:
    image: fraud-platform:latest
    command: ["mlflow", "ui", "--backend-store-uri", "sqlite:////app/mlflow.db", "--host", "0.0.0.0", "--port", "5000"]
    ports: ["5000:5000"]
    volumes: ["./mlflow.db:/app/mlflow.db"]
