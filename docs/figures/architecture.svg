<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <style>
      .b{fill:#fff;stroke:#c3c2b7;stroke-width:1.2}
      .tr{fill:#fdf1ec;stroke:#eb6834}
      .sv{fill:#eef4fc;stroke:#2a78d6}
      .ui{fill:#eaf7f1;stroke:#1baf7a}
      .pc{fill:#fff8e6;stroke:#eda100}
      .t{fill:#0b0b0b;font-weight:600}
      .s{fill:#52514e;font-size:11.5px}
      .h{fill:#52514e;font-size:12px;font-weight:600;letter-spacing:.06em}
      .l{stroke:#52514e;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .d{stroke:#52514e;stroke-width:1.2;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1100" height="660" fill="#fcfcfb"/>
  <rect x="0" y="0" width="1100" height="30" fill="#5c1d1d"/>
  <text x="550" y="20" text-anchor="middle" fill="#ffd9d9" font-weight="700" font-size="12.5">FOR EDUCATION AND RESEARCH ONLY · NOT FOR CLINICAL USE</text>

  <text x="30" y="60" class="h">OFFLINE · DATA + TRAINING (DVC pipeline: dvc repro)</text>
  <rect x="30" y="75" width="200" height="78" rx="10" class="b tr"/><text x="45" y="100" class="t">Data (DVC-versioned)</text><text x="45" y="119" class="s">NIH ChestX-ray14 + boxes</text><text x="45" y="134" class="s">MSD Task09 Spleen CT</text><text x="45" y="148" class="s">(phantom fallback, same layout)</text>
  <rect x="265" y="75" width="185" height="78" rx="10" class="b tr"/><text x="280" y="100" class="t">preprocess</text><text x="280" y="119" class="s">resize · normalise</text><text x="280" y="134" class="s">patient-level split</text>
  <rect x="485" y="62" width="215" height="58" rx="10" class="b tr"/><text x="500" y="86" class="t">train_cls</text><text x="500" y="105" class="s">EfficientNet-B0 / DenseNet-121</text>
  <rect x="485" y="128" width="215" height="58" rx="10" class="b tr"/><text x="500" y="152" class="t">train_seg</text><text x="500" y="171" class="s">MONAI 3D U-Net, Dice-CE</text>
  <rect x="735" y="75" width="165" height="78" rx="10" class="b tr"/><text x="750" y="100" class="t">evaluate</text><text x="750" y="119" class="s">AUROC · Dice · Grad-CAM</text><text x="750" y="134" class="s">vs boxes · subgroup bias</text>
  <rect x="935" y="75" width="140" height="78" rx="10" class="b pc"/><text x="950" y="100" class="t">models/ + metrics/</text><text x="950" y="119" class="s">dvc metrics show</text>
  <path d="M230,114 H260" class="l"/><path d="M450,105 C470,105 465,91 480,91" class="l"/><path d="M450,122 C470,122 465,157 480,157" class="l"/>
  <path d="M700,91 C718,91 715,105 730,105" class="l"/><path d="M700,157 C718,157 715,124 730,124" class="l"/><path d="M900,114 H930" class="l"/>

  <text x="30" y="245" class="h">ONLINE · DICOM → AI → RADIOLOGIST</text>
  <rect x="30" y="262" width="175" height="80" rx="10" class="b sv"/><text x="45" y="287" class="t">Modality / PACS</text><text x="45" y="306" class="s">send_studies.py</text><text x="45" y="321" class="s">DICOM C-STORE :4242</text>
  <rect x="240" y="262" width="190" height="80" rx="10" class="b sv"/><text x="255" y="287" class="t">Orthanc DICOM server</text><text x="255" y="306" class="s">stores studies, REST :8042</text><text x="255" y="321" class="s">/changes → StableStudy</text>
  <rect x="470" y="248" width="325" height="160" rx="10" class="b sv"/>
  <text x="485" y="273" class="t">AI worker (medai.service.worker)</text>
  <text x="485" y="296" class="s">1  poll /changes, fetch all instances</text>
  <text x="485" y="315" class="s">2  DX/CR → classifier (8 findings) + Grad-CAM</text>
  <text x="485" y="334" class="s">3  CT → slices sorted by z, HU → 3D U-Net mask</text>
  <text x="485" y="353" class="s">4  save results + audit "ai_analyzed"</text>
  <text x="485" y="372" class="s">5  upload overlay as Secondary Capture series</text>
  <text x="485" y="391" class="s">    into the same study (back to Orthanc)</text>
  <rect x="830" y="262" width="245" height="80" rx="10" class="b pc"/><text x="845" y="287" class="t">Results store (SQLite)</text><text x="845" y="306" class="s">studies · AI outputs · decisions</text><text x="845" y="321" class="s">hash-chained audit log</text>
  <path d="M205,302 H235" class="l"/><path d="M430,302 H465" class="l"/><path d="M795,302 H825" class="l"/>
  <path d="M620,408 C620,440 380,440 340,346" class="d"/><text x="430" y="452" class="s">AI overlay series (C-STORE back)</text>
  <path d="M1000,153 C1000,200 700,200 640,243" class="d"/><text x="845" y="222" class="s">model weights</text>

  <rect x="810" y="440" width="265" height="80" rx="10" class="b sv"/><text x="825" y="465" class="t">FastAPI (medai.service.api)</text><text x="825" y="484" class="s">/api/studies · image/overlay PNG</text><text x="825" y="499" class="s">/decision · /audit · /model-card</text>
  <path d="M942,342 V435" class="l"/>
  <rect x="470" y="470" width="300" height="120" rx="10" class="b ui"/>
  <text x="485" y="495" class="t">React viewer (radiologist)</text>
  <text x="485" y="517" class="s">worklist · scan + AI overlay (opacity, CT slices)</text>
  <text x="485" y="536" class="s">per-finding confidence vs threshold</text>
  <text x="485" y="555" class="s">Approve / Reject + comment → audit entry</text>
  <text x="485" y="574" class="s">audit log (chain verified) · model card &amp; limits</text>
  <path d="M805,515 H775" class="l"/><path d="M775,545 H805" class="l"/>

  <rect x="30" y="610" width="1045" height="36" rx="10" fill="#f0efec"/>
  <text x="45" y="633" class="s">Docker Compose: orthancteam/orthanc · medimaging-ai worker · medimaging-ai API (serves the built React app) · shared results volume</text>
</svg>
