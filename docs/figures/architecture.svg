<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <style>
      .box{fill:#fff;stroke:#c3c2b7;stroke-width:1.2;rx:10}
      .on{fill:#eef4fc;stroke:#2a78d6}
      .off{fill:#fdf1ec;stroke:#eb6834}
      .ops{fill:#eaf7f1;stroke:#1baf7a}
      .t{fill:#0b0b0b;font-weight:600}
      .s{fill:#52514e;font-size:11.5px}
      .h{fill:#52514e;font-size:12px;font-weight:600;letter-spacing:.06em}
      .l{stroke:#52514e;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .d{stroke:#52514e;stroke-width:1.2;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1100" height="640" fill="#fcfcfb"/>

  <text x="30" y="34" class="h">OFFLINE  ·  TRAINING (batch)</text>
  <rect x="30" y="50" width="180" height="70" class="box off"/><text x="45" y="76" class="t">IEEE-CIS (Kaggle)</text><text x="45" y="96" class="s">or schema-identical</text><text x="45" y="110" class="s">synthetic generator</text>
  <rect x="250" y="50" width="190" height="70" class="box off"/><text x="265" y="76" class="t">Feature engineering</text><text x="265" y="96" class="s">velocity · amount vs avg ·</text><text x="265" y="110" class="s">device / location change</text>
  <rect x="480" y="50" width="170" height="70" class="box off"/><text x="495" y="76" class="t">XGBoost</text><text x="495" y="96" class="s">class weights / SMOTE</text><text x="495" y="110" class="s">PR-AUC, time split</text>
  <rect x="480" y="140" width="170" height="70" class="box off"/><text x="495" y="166" class="t">GraphSAGE (PyG)</text><text x="495" y="186" class="s">account–device–card</text><text x="495" y="200" class="s">graph → ring risk</text>
  <rect x="690" y="95" width="160" height="70" class="box off"/><text x="705" y="121" class="t">Stacker (blend)</text><text x="705" y="141" class="s">logistic regression</text><text x="705" y="155" class="s">fit on validation</text>
  <rect x="890" y="50" width="180" height="70" class="box off"/><text x="905" y="76" class="t">MLflow</text><text x="905" y="96" class="s">runs · metrics ·</text><text x="905" y="110" class="s">model registry</text>
  <path d="M210,85 H245" class="l"/><path d="M440,85 H475" class="l"/><path d="M440,100 C460,100 455,175 475,175" class="l"/>
  <path d="M650,85 C670,85 670,120 685,120" class="l"/><path d="M650,175 C670,175 670,140 685,140" class="l"/>
  <path d="M650,70 C760,40 820,60 885,75" class="d"/>

  <rect x="250" y="240" width="400" height="95" class="box" style="fill:#fff8e6;stroke:#eda100"/>
  <text x="265" y="266" class="t">Feast feature store</text>
  <text x="265" y="286" class="s">account_profile · device_profile (daily snapshots, point-in-time join)</text>
  <text x="265" y="302" class="s">account_graph_risk · device_graph_risk (GNN ring scores)</text><text x="265" y="320" class="s">offline: parquet · online: SQLite (Redis in production)</text>
  <path d="M345,120 V235" class="l"/><path d="M565,210 V235" class="l"/>
  <path d="M380,240 C380,180 470,170 475,110" class="d"/>

  <text x="30" y="370" class="h">ONLINE  ·  SERVING (real time, ~1–3 ms per transaction)</text>
  <rect x="30" y="390" width="170" height="70" class="box on"/><text x="45" y="416" class="t">Kafka producer</text><text x="45" y="436" class="s">replays test period,</text><text x="45" y="450" class="s">keyed by account</text>
  <rect x="235" y="390" width="130" height="70" class="box on"/><text x="250" y="416" class="t">Kafka</text><text x="250" y="436" class="s">topic:</text><text x="250" y="450" class="s">transactions</text>
  <rect x="400" y="380" width="300" height="160" class="box on"/>
  <text x="415" y="406" class="t">FastAPI scoring service + consumer</text>
  <text x="415" y="430" class="s">1  stream state → real-time features</text>
  <text x="415" y="450" class="s">2  Feast online → profile + ring risk</text>
  <text x="415" y="470" class="s">3  XGBoost → blend → decision</text>
  <text x="415" y="490" class="s">4  reasons (feature contributions)</text>
  <text x="415" y="510" class="s">5  open case if score ≥ threshold</text>
  <text x="415" y="528" class="s">REST: /score  /cases  /feedback  /stats</text>
  <rect x="740" y="390" width="150" height="70" class="box on"/><text x="755" y="416" class="t">Kafka</text><text x="755" y="436" class="s">topic:</text><text x="755" y="450" class="s">fraud-scores</text>
  <rect x="740" y="480" width="150" height="70" class="box on"/><text x="755" y="506" class="t">Case store</text><text x="755" y="526" class="s">cases · scores ·</text><text x="755" y="540" class="s">feedback (SQLite)</text>
  <rect x="925" y="480" width="150" height="70" class="box on"/><text x="940" y="506" class="t">Analyst dashboard</text><text x="940" y="526" class="s">Streamlit: alerts,</text><text x="940" y="540" class="s">status, labels</text>
  <path d="M200,425 H230" class="l"/><path d="M365,425 H395" class="l"/><path d="M700,425 H735" class="l"/><path d="M700,505 H735" class="l"/>
  <path d="M920,515 H894" class="l"/>
  <path d="M500,335 V375" class="l"/>

  <rect x="925" y="290" width="150" height="80" class="box ops"/><text x="940" y="316" class="t">Evidently drift</text><text x="940" y="336" class="s">hourly CronJob;</text><text x="940" y="350" class="s">drift or PR-AUC drop</text><text x="940" y="364" class="s">→ retrain trigger</text>
  <path d="M890,500 C930,490 960,430 960,375" class="d"/>
  <path d="M960,290 C960,230 820,200 760,170" class="d"/>
  <text x="845" y="215" class="s">retrain</text>
  <path d="M780,165 C780,300 700,330 660,390" class="d"/>
  <text x="790" y="290" class="s">hot-reload model</text>

  <rect x="30" y="580" width="1040" height="40" rx="10" fill="#f0efec"/>
  <text x="45" y="605" class="s">Deployed on Kubernetes (Minikube): Kafka StatefulSet · API Deployment (+consumer) · Dashboard Deployment · replay Job · drift CronJob · shared PVC for model, Feast store and cases</text>
</svg>
