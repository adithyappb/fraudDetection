apiVersion: v1
kind: Namespace
metadata:
  name: fraud
---
# Shared volume: model artifacts, Feast offline/online store, case DB.
# Minikube's default storage class is fine (single node, ReadWriteOnce shared by co-located pods).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fraud-state
  namespace: fraud
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-env
  namespace: fraud
data:
  KAFKA_BOOTSTRAP: kafka.fraud.svc.cluster.local:9092
  ARTIFACTS_DIR: /state/artifacts
  MLFLOW_TRACKING_URI: sqlite:////state/mlflow.db
